<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <linearGradient id="tropSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#29B6F6"/>
      <stop offset="65%" stop-color="#81D4FA"/>
      <stop offset="100%" stop-color="#E1F5FE"/>
    </linearGradient>
    <linearGradient id="oceanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0288D1"/>
      <stop offset="100%" stop-color="#26C6DA"/>
    </linearGradient>
    <linearGradient id="fairwayGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#66BB6A"/>
      <stop offset="50%" stop-color="#43A047"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="1280" height="420" fill="url(#tropSky)"/>
  <!-- Sun -->
  <circle cx="1100" cy="110" r="65" fill="#FFEE58" stroke="#FDD835" stroke-width="8"/>
  <!-- Fluffy Clouds -->
  <g fill="#FFFFFF" opacity="0.9">
    <ellipse cx="240" cy="110" rx="85" ry="38"/>
    <ellipse cx="290" cy="95" rx="60" ry="35"/>
    <ellipse cx="190" cy="105" rx="50" ry="28"/>
    <ellipse cx="760" cy="85" rx="95" ry="36"/>
    <ellipse cx="820" cy="75" rx="65" ry="30"/>
  </g>
  <!-- Ocean Horizon -->
  <rect y="300" width="1280" height="120" fill="url(#oceanGrad)"/>
  <path d="M0 340 Q 160 325 320 340 T 640 340 T 960 340 T 1280 340" fill="none" stroke="#B2EBF2" stroke-width="4" opacity="0.7"/>
  <!-- Distant Tropical Islands -->
  <path d="M80 320 Q 190 230 310 320 Z" fill="#4CAF50"/>
  <path d="M920 320 Q 1060 220 1200 320 Z" fill="#388E3C"/>
  <!-- Sandy Beach Strip -->
  <path d="M0 390 Q 640 365 1280 390 L 1280 450 L 0 450 Z" fill="#FFE082"/>
  <!-- Rolling Turf & Perspective Fairway -->
  <path d="M0 410 Q 640 375 1280 410 L 1280 800 L 0 800 Z" fill="url(#fairwayGrad)"/>
  <path d="M510 400 L 770 400 L 1060 800 L 220 800 Z" fill="#81C784" opacity="0.65"/>
  <!-- Palm Trees Left & Right -->
  <g stroke="#6D4C41" stroke-width="18" fill="none" stroke-linecap="round">
    <path d="M180 540 Q 210 420 155 310"/>
    <path d="M1080 550 Q 1045 430 1110 315"/>
  </g>
  <!-- Palm Fronds & Coconuts -->
  <g fill="#2E7D32">
    <path d="M155 310 Q 80 280 60 330 Q 110 320 155 310"/>
    <path d="M155 310 Q 140 230 205 245 Q 175 280 155 310"/>
    <path d="M155 310 Q 230 280 250 335 Q 195 315 155 310"/>
    <path d="M1110 315 Q 1030 280 1015 335 Q 1065 320 1110 315"/>
    <path d="M1110 315 Q 1100 235 1165 250 Q 1135 285 1110 315"/>
    <path d="M1110 315 Q 1185 285 1205 340 Q 1150 320 1110 315"/>
  </g>
  <circle cx="150" cy="322" r="11" fill="#4E342E"/>
  <circle cx="166" cy="320" r="11" fill="#4E342E"/>
  <circle cx="1104" cy="326" r="11" fill="#4E342E"/>
  <!-- Slapstick Hazard: Inflatable Kiddie Pool on Right -->
  <ellipse cx="990" cy="575" rx="85" ry="36" fill="#FF4081" stroke="#F50057" stroke-width="6"/>
  <ellipse cx="990" cy="568" rx="72" ry="26" fill="#00E5FF"/>
</svg>
