<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320">
  <!-- Shadow -->
  <ellipse cx="120" cy="295" rx="65" ry="16" fill="rgba(0,0,0,0.28)"/>
  <!-- Shoes -->
  <ellipse cx="95" cy="285" rx="22" ry="11" fill="#FFFFFF" stroke="#263238" stroke-width="4"/>
  <ellipse cx="145" cy="285" rx="22" ry="11" fill="#FFFFFF" stroke="#263238" stroke-width="4"/>
  <!-- Legs & Shorts -->
  <rect x="86" y="220" width="20" height="62" rx="8" fill="#FFCCBC" stroke="#263238" stroke-width="3"/>
  <rect x="134" y="220" width="20" height="62" rx="8" fill="#FFCCBC" stroke="#263238" stroke-width="3"/>
  <rect x="80" y="185" width="80" height="45" rx="10" fill="#FFF59D" stroke="#263238" stroke-width="4"/>
  <!-- Torso Coiled -->
  <g transform="rotate(-12 120 150)">
    <rect x="75" y="110" width="90" height="82" rx="20" fill="#29B6F6" stroke="#263238" stroke-width="4"/>
    <rect x="77" y="140" width="86" height="16" fill="#FFEE58"/>
  </g>
  <!-- Arms Raised High in Backswing -->
  <path d="M90 125 L 55 80 L 75 45" fill="none" stroke="#FFCCBC" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Club Wound Behind Head -->
  <line x1="75" y1="45" x2="185" y2="25" stroke="#B0BEC5" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="192" cy="24" rx="16" ry="9" fill="#37474F" stroke="#263238" stroke-width="3"/>
  <!-- Head & Cap -->
  <circle cx="120" cy="72" r="38" fill="#FFCCBC" stroke="#263238" stroke-width="4"/>
  <path d="M82 65 Q 120 25 158 65 Z" fill="#FF5252" stroke="#263238" stroke-width="4"/>
  <circle cx="120" cy="36" r="7" fill="#FFFFFF" stroke="#263238" stroke-width="3"/>
</svg>
