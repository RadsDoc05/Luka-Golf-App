<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320">
  <!-- Shadow -->
  <ellipse cx="120" cy="295" rx="65" ry="16" fill="rgba(0,0,0,0.28)"/>
  <!-- Action Swoosh Arc -->
  <path d="M40 260 Q 210 290 215 90" fill="none" stroke="#FFF59D" stroke-width="18" stroke-linecap="round" opacity="0.65"/>
  <!-- Shoes (Right foot pivoted) -->
  <ellipse cx="95" cy="285" rx="22" ry="11" fill="#FFFFFF" stroke="#263238" stroke-width="4"/>
  <ellipse cx="150" cy="278" rx="14" ry="20" fill="#FFFFFF" stroke="#263238" stroke-width="4"/>
  <!-- Legs & Shorts -->
  <rect x="86" y="220" width="20" height="62" rx="8" fill="#FFCCBC" stroke="#263238" stroke-width="3"/>
  <rect x="134" y="220" width="20" height="58" rx="8" fill="#FFCCBC" stroke="#263238" stroke-width="3"/>
  <rect x="80" y="185" width="80" height="45" rx="10" fill="#FFF59D" stroke="#263238" stroke-width="4"/>
  <!-- Torso Rotated Toward Target -->
  <g transform="rotate(14 120 150)">
    <rect x="75" y="110" width="90" height="82" rx="20" fill="#29B6F6" stroke="#263238" stroke-width="4"/>
    <rect x="77" y="140" width="86" height="16" fill="#FFEE58"/>
  </g>
  <!-- Arms High Follow-Through -->
  <path d="M150 125 L 195 75 L 160 40" fill="none" stroke="#FFCCBC" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Club Finish -->
  <line x1="160" y1="40" x2="70" y2="25" stroke="#B0BEC5" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="65" cy="24" rx="16" ry="9" fill="#37474F" stroke="#263238" stroke-width="3"/>
  <!-- Head Watching Ball Down Fairway -->
  <circle cx="122" cy="70" r="38" fill="#FFCCBC" stroke="#263238" stroke-width="4"/>
  <path d="M84 63 Q 122 23 160 63 Z" fill="#FF5252" stroke="#263238" stroke-width="4"/>
  <circle cx="122" cy="34" r="7" fill="#FFFFFF" stroke="#263238" stroke-width="3"/>
</svg>
